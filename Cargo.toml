[package]
name = "vast7-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "23.0"
winit = { version = "0.30" }
egui = "0.30"
egui-winit = { version = "0.30", default-features = false, features = ["wayland", "x11"] }
